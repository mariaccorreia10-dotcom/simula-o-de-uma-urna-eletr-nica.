<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Urna Eletrônica</title>

<style>
body{
    background:#222;
    font-family:Arial;
    display:flex;
    justify-content:center;
    padding:30px;
}

.urna{
    background:#ccc;
    width:500px;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 20px #000;
}

.tela{
    background:#eee;
    border:8px solid #333;
    padding:25px;
    text-align:center;
}

h1{
    font-size:25px;
}

.candidato{
    background:#fff;
    border:2px solid #333;
    padding:15px;
    margin:12px;
    cursor:pointer;
    border-radius:5px;
}

.candidato:hover{
    background:#ddd;
}

.numero{
    font-size:20px;
    font-weight:bold;
}

#mensagem{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

.teclado{
    margin-top:20px;
    text-align:center;
}

.teclado button{
    background:#111;
    color:white;
    padding:12px 18px;
    margin:3px;
    border:0;
    font-size:18px;
}
</style>
</head>

<body>

<div class="urna">

<div class="tela">

<h1 id="cargo">PRESIDENTE</h1>

<div class="candidato" onclick="votar('Ariana Grande')">
    <div class="numero">11</div>
    Ariana Grande
</div>

<div class="candidato" onclick="votar('Sabrina Carpenter')">
    <div class="numero">22</div>
    Sabrina Carpenter
</div>

<div class="candidato" onclick="votar('Taylor Swift')">
    <div class="numero">13</div>
    Taylor Swift
</div>

<div id="mensagem"></div>

</div>

<div class="teclado">
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>0</button>
</div>

</div>

<script>

function votar(nome){

    document.getElementById("mensagem").innerText =
    "Você votou em: " + nome;

    setTimeout(function(){

        document.getElementById("mensagem").innerText = "";

        if(document.getElementById("cargo").innerText == "PRESIDENTE"){
            document.getElementById("cargo").innerText = "GOVERNADOR";
        }else{
            document.getElementById("cargo").innerText = "FIM DA VOTAÇÃO";
        }

    },2000);
}

</script>

</body>
</html>
