<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Urna Eletrônica</title>

<style>
body{
    background:#222;
    font-family:Arial;
    display:flex;
    justify-content:center;
    padding:30px;
}

.urna{
    width:700px;
    background:#bcbcbc;
    border:10px solid #888;
    border-radius:15px;
    padding:25px;
    display:flex;
    gap:25px;
    box-shadow:0 0 25px black;
}

/* TELA */
.tela{
    background:#eee;
    width:380px;
    height:400px;
    border:12px solid #333;
    padding:20px;
    box-sizing:border-box;
}

.tela h2{
    text-align:center;
    border-bottom:2px solid #555;
    padding-bottom:10px;
}

.candidato{
    margin:15px 0;
    font-size:18px;
}

.candidato b{
    font-size:23px;
}

#numero{
    background:white;
    border:2px solid #333;
    height:45px;
    width:120px;
    margin:20px auto;
    font-size:32px;
    text-align:center;
}

#nome{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    min-height:50px;
}

#mensagem{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-top:15px;
}

/* TECLADO */
.teclado{
    width:230px;
    background:#777;
    padding:15px;
    border-radius:8px;
}

.teclado h3{
    color:white;
    text-align:center;
    margin-top:0;
}

.numeros{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.numeros button{
    height:55px;
    background:#111;
    color:white;
    border:2px solid #333;
    border-radius:5px;
    font-size:22px;
    cursor:pointer;
}

.acoes{
    margin-top:15px;
}

.acoes button{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:0;
    font-weight:bold;
    cursor:pointer
